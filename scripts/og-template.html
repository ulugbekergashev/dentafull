<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>DentaCRM OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: #0f172a;
      background-color: #f8fafc;
      background-image:
        radial-gradient(60rem 40rem at 10% -10%, rgba(37, 99, 235, .18), transparent 60%),
        radial-gradient(45rem 35rem at 95% 10%, rgba(99, 102, 241, .16), transparent 62%),
        radial-gradient(50rem 30rem at 55% 110%, rgba(14, 165, 233, .14), transparent 60%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 72px;
      position: relative;
    }

    /* Nozik to'r */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, .05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .05) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 75% 65% at 40% 40%, #000 35%, transparent 100%);
      mask-image: radial-gradient(ellipse 75% 65% at 40% 40%, #000 35%, transparent 100%);
      pointer-events: none;
    }

    .row { position: relative; z-index: 1; }

    .brand { display: flex; align-items: center; gap: 16px; }
    .brand svg { width: 56px; height: 56px; }
    .brand span { font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
    .brand .accent { color: #2563eb; }

    h1 {
      font-size: 62px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -.03em;
      max-width: 940px;
      text-wrap: balance;
    }

    h1 .grad {
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.sub {
      margin-top: 22px;
      font-size: 26px;
      line-height: 1.45;
      color: #475569;
      max-width: 880px;
    }

    .chips { display: flex; gap: 12px; flex-wrap: wrap; }

    .chip {
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 6px 20px rgba(37, 99, 235, .08);
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 20px;
      font-weight: 600;
      color: #334155;
    }

    .phone {
      font-size: 24px;
      font-weight: 800;
      color: #1d4ed8;
      white-space: nowrap;
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
  </style>
</head>
<body>
  <div class="row brand">
    <!-- Belgi components/Logo.tsx dagi bilan bir xil -->
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="tooth">
          <path d="M50 13C55.5 7 62 3.5 70.5 3.5C85 3.5 94 15 94 30.5C94 41 90.5 51.5 87.5 63C84.5 74.5 82.5 86 78.5 92.5C75.5 97.5 68.5 96.5 66.5 90.5C63.5 81 61.5 69 57.5 63C54.5 58.5 45.5 58.5 42.5 63C38.5 69 36.5 81 33.5 90.5C31.5 96.5 24.5 97.5 21.5 92.5C17.5 86 15.5 74.5 12.5 63C9.5 51.5 6 41 6 30.5C6 15 15 3.5 29.5 3.5C38 3.5 44.5 7 50 13Z" />
        </clipPath>
      </defs>
      <g clip-path="url(#tooth)">
        <rect x="-20" y="-20" width="140" height="140" fill="#A9C2F5" />
        <polygon points="50,-20 68,-20 39,120 21,120" fill="#5B87EE" />
        <polygon points="-20,-20 50,-20 21,120 -20,120" fill="#2563EB" />
      </g>
    </svg>
    <span>Denta<span class="accent">CRM</span></span>
  </div>

  <div class="row">
    <h1>Stomatologiya klinikalari uchun <span class="grad">aqlli boshqaruv</span> tizimi</h1>
    <p class="sub">
      Bemor kartasi va tish xaritasi, qabullar taqvimi, kassa, SMS va Telegram
      eslatmalar, DentaAI — hammasi bitta oynada.
    </p>
  </div>

  <div class="row foot">
    <div class="chips">
      <span class="chip">40+ klinika</span>
      <span class="chip">1 kunda o'rnatish</span>
      <span class="chip">7 kun bepul</span>
    </div>
    <span class="phone">+998 90 824 29 92</span>
  </div>
</body>
</html>
